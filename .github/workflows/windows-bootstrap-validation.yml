name: Windows bootstrap validation

on:
  push:
    branches:
      - feat/windows-support-installer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse and analyze with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\win", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }

      - name: Download and hash pinned MSI packages
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -UseBasicParsing -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.102.3-amd64.msi" -OutFile "$env:RUNNER_TEMP\tailscale.msi"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.4.9/rustdesk-1.4.9-x86_64.msi" -OutFile "$env:RUNNER_TEMP\rustdesk.msi"
          $tailscaleHash = (Get-FileHash "$env:RUNNER_TEMP\tailscale.msi" -Algorithm SHA256).Hash.ToLowerInvariant()
          $rustDeskHash = (Get-FileHash "$env:RUNNER_TEMP\rustdesk.msi" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($tailscaleHash -cne "03ac8183c6e3ce276e9b44281ebe7e4c02aef28a971034ca170c4b665df42dce") { throw "Tailscale hash mismatch" }
          if ($rustDeskHash -cne "c87d2f4cef2a5acd6003b6507dcfbf5d5168a256db082cd90b54d35193224aaa") { throw "RustDesk hash mismatch" }

      - name: Verify MSI Authenticode identities
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $packages = @(
            @{ File = "$env:RUNNER_TEMP\tailscale.msi"; Thumbprint = "108F172FDE945B21A5C0696731D6220D67D1C39E"; Subject = "^CN=Tailscale Inc\.(?:,|$)" },
            @{ File = "$env:RUNNER_TEMP\rustdesk.msi"; Thumbprint = "4230334F8A7DD84E50D0273EF379E8B4A82F5DA5"; Subject = "^CN=PURSLANE(?:,|$)" }
          )
          foreach ($package in $packages) {
            $signature = Get-AuthenticodeSignature -LiteralPath $package.File
            Write-Host "$($package.File): status=$($signature.Status) subject=$($signature.SignerCertificate.Subject) thumbprint=$($signature.SignerCertificate.Thumbprint)"
            if ($signature.Status -ne "Valid") { throw "Invalid signature for $($package.File)" }
            if ($signature.SignerCertificate.Subject -notmatch $package.Subject) { throw "Signer subject mismatch for $($package.File)" }
            if ($signature.SignerCertificate.Thumbprint -cne $package.Thumbprint) { throw "Signer thumbprint mismatch for $($package.File)" }
          }

      - name: Verify packaged executable build identities
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $packages = @(
            @{ File = "$env:RUNNER_TEMP\tailscale.msi"; Exe = "tailscale.exe"; ProductVersion = "1.102.3-t9329c3677-ga522f65e9"; Thumbprint = "108F172FDE945B21A5C0696731D6220D67D1C39E" },
            @{ File = "$env:RUNNER_TEMP\rustdesk.msi"; Exe = "rustdesk.exe"; ProductVersion = "1.4.9+67"; Thumbprint = "4230334F8A7DD84E50D0273EF379E8B4A82F5DA5" }
          )
          foreach ($package in $packages) {
            $target = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileNameWithoutExtension($package.File) + "-admin-image")
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            $arguments = @("/a", ('"{0}"' -f $package.File), "/qn", ("TARGETDIR={0}" -f ('"{0}"' -f $target)))
            $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Administrative MSI extraction failed for $($package.File): $($process.ExitCode)" }
            $exe = Get-ChildItem -LiteralPath $target -Filter $package.Exe -Recurse | Select-Object -First 1
            if ($null -eq $exe) { throw "Packaged executable missing from $($package.File)" }
            $productVersion = $exe.VersionInfo.ProductVersion.Trim()
            $signature = Get-AuthenticodeSignature -LiteralPath $exe.FullName
            Write-Host "$($exe.FullName): ProductVersion=$productVersion status=$($signature.Status) thumbprint=$($signature.SignerCertificate.Thumbprint)"
            if ($productVersion -cne $package.ProductVersion) { throw "Packaged executable ProductVersion mismatch: $productVersion" }
            if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Thumbprint -cne $package.Thumbprint) { throw "Packaged executable signature mismatch: $($exe.FullName)" }
          }

      - name: Verify secure work-directory ACLs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile("$PWD\win", [ref]$tokens, [ref]$errors)
          function Import-Function([string]$Name) {
            $functionAst = $ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $Name }, $true) | Select-Object -First 1
            $bodyText = $functionAst.Body.Extent.Text
            $bodyText = $bodyText.Substring(1, $bodyText.Length - 2)
            Set-Item -Path ("Function:\global:{0}" -f $Name) -Value ([scriptblock]::Create($bodyText))
          }
          Import-Function "Initialize-SecureDirectory"
          Import-Function "Initialize-SecureWorkDirectory"
          $script:WorkRootName = "CityPlug\SupportBootstrap"
          try {
            $work = Initialize-SecureWorkDirectory
            $acl = Get-Acl -LiteralPath $work
            $owner = $acl.GetOwner([Security.Principal.SecurityIdentifier]).Value
            if ($owner -ne "S-1-5-32-544" -or -not $acl.AreAccessRulesProtected) { throw "Secure work-directory verification failed" }
          } catch {
            Write-Host ("::error title=Secure work-directory failure::{0}" -f $_.Exception.Message)
            exit 1
          }

      - name: Verify empty native password argument
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile("$PWD\win", [ref]$tokens, [ref]$errors)
          $functionAst = $ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq "Clear-RustDeskPermanentPassword" }, $true) | Select-Object -First 1
          Invoke-Expression $functionAst.Extent.Text
          $probeSource = @'
          using System;
          public class PasswordArgProbe {
              public static int Main(string[] args) {
                  if (args.Length == 2 && args[0] == "--password" && args[1] == "") {
                      Console.WriteLine("Done!");
                      return 0;
                  }
                  Console.Error.WriteLine("Expected --password followed by one empty argument; received " + args.Length);
                  return 9;
              }
          }
          '@
          $probe = "$env:RUNNER_TEMP\password-arg-probe.exe"
          Add-Type -TypeDefinition $probeSource -Language CSharp -OutputAssembly $probe -OutputType ConsoleApplication
          $script:RustDeskExe = $probe
          Clear-RustDeskPermanentPassword

      - name: Verify RustDesk firewall quarantine
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile("$PWD\win", [ref]$tokens, [ref]$errors)
          function Import-Function([string]$Name) {
            $functionAst = $ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $Name }, $true) | Select-Object -First 1
            $bodyText = $functionAst.Body.Extent.Text
            $bodyText = $bodyText.Substring(1, $bodyText.Length - 2)
            Set-Item -Path ("Function:\global:{0}" -f $Name) -Value ([scriptblock]::Create($bodyText))
          }
          Import-Function "Write-Log"
          Import-Function "Enable-RustDeskQuarantine"
          Import-Function "Disable-RustDeskQuarantine"
          $LogPath = "$env:RUNNER_TEMP\cityplug-validation.log"
          $script:RustDeskExe = "$env:windir\System32\notepad.exe"
          $script:RustDeskQuarantineGroup = "CityPlug RustDesk bootstrap quarantine"
          $script:RustDeskQuarantineRuleNames = @()
          try {
            Enable-RustDeskQuarantine
          } finally {
            Disable-RustDeskQuarantine
          }
